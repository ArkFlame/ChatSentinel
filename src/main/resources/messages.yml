# ChatSentinel messages
#
# Every message is grouped by domain. The keys below are the full list of
# messages this plugin can send, so nothing is hidden.
#
# Cancellation text lives under "cancel":
#   cancel.fallback   shown when a module cancels a message and has no specific text
#   cancel.<module>   shown when that module cancels a message
#                     (flood, syntax, cooldown, similarity, blacklist, ...)
#
# Set a message to "" to disable it. Missing keys fall back to the bundled
# English default, so you never need to copy new keys by hand after an update.
#
# Colour codes use "&". Colours work on Spigot/Paper, BungeeCord and Velocity.

# Language used when a player's client language has no section below.
default: "en"

langs:
  en:
    general:
      no_permission: "&cYou do not have permission to use this command!"
      unknown_command: "&cUnknown command. Use &f/chatsentinel help&c to see available commands."
      reload: "&a&lCS: &aConfiguration reloaded."
      console_only: "&cOnly players can use this feature."
      notify_enabled: "&aChatSentinel notifications are now enabled!"
      notify_disabled: "&cChatSentinel notifications are now disabled!"
      usage: "&cUsage: &f%usage%"

    help:
      header: "&a&lChatSentinel &7commands:"
      lines: |-
        &e/chatsentinel help &7- &bShows this help message.
        &e/chatsentinel reload &7- &bReloads config, messages and filters.
        &e/chatsentinel status &7- &bShows module and filter status.
        &e/chatsentinel module list|enable|disable|toggle <module> &7- &bManages modules live.
        &e/chatsentinel clear [reason] &7- &bClears visible chat.
        &e/chatsentinel notify &7- &bToggles moderation notifications.
        &e/chatsentinel spy &7- &bToggles spy alerts.
        &e/chatsentinel regex add <module> common|raw <text> &7- &bAdds a custom filter.
        &e/servermute [on|off|toggle] [reason] &7- &bMutes or unmutes chat.
        &e/socialspy [module|status] &7- &bToggles SocialSpy modules.
        &e/autocorrect [on|off|toggle] &7- &bToggles personal correction.

    spy:
      enabled: "&aSpy alerts enabled."
      disabled: "&cSpy alerts disabled."

    chat:
      clear: "&dGame chat has been cleared by &f%player%&d. Reason: &f%reason%"
      clear_bypass: "&7Chat was cleared by &f%player%&7, but you bypassed it. Reason: &f%reason%"
      clear_summary: "&aChat clear sent to &f%cleared%&a players; skipped &f%bypassed%&a bypass players."
      server_muted: "&c&lCS: &cChat is currently muted."

    # Shown to the player who was stopped.
    cancel:
      fallback: "&c&lCS: &cYour message was blocked by &f%module%&c."
      blacklist: "&c&lCS: &cYou cannot write that: &f%word%&c."
      security: "&c&lCS: &cYour message matched a security protection rule."
      advertisement: "&c&lCS: &cAdvertising is not allowed: &f%word%&c."
      offense: "&c&lCS: &cYou cannot write that: &f%word%&c."
      user: "&c&lCS: &cYou cannot write that: &f%word%&c."
      client: "&c&lCS: &cYou cannot write that: &f%word%&c."
      flood: "&c&lCS: &cPlease do not flood the chat."
      syntax: "&c&lCS: &cSyntax is disabled on this server."
      cooldown: "&c&lCS: &cYou can write your next message in &f%cooldown% &cseconds."
      similarity: "&c&lCS: &cStop repeating similar messages. Similarity: &f%similarity%"
      capitalization: "&6&lCS: &ePlease avoid excessive capitalization."
      allowed_characters: "&c&lCS: &cYour message contains characters that are not allowed."
      no_move_chat: "&c&lCS: &cPlease move at least &f%distance% &cblocks before typing in chat."
      server_mute: "&c&lCS: &cChat is currently muted."

    server_mute:
      enabled: "&dChat has been muted by &f%player%&d. Reason: &f%reason%"
      disabled: "&dChat has been unmuted by &f%player%&d. Reason: &f%reason%"

    correction:
      enabled: "&aAuto-correction enabled."
      disabled: "&cAuto-correction disabled."
      usage: "&cUsage: &f/autocorrect [on|off|toggle]"
      console_only: "&cOnly players can toggle auto-correction."
      notice: "&7&lCS: &7One of your words was corrected. Use &e/autocorrect off &7to disable this."

